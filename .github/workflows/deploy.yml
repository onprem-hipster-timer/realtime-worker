name: Deploy

# main에 push되면 Worker를 wrangler로 배포한다.
#
# - 배포 토큰과 PUSH_SECRET은 GitHub에 저장하지 않는다. Workload Identity Federation(키 없음)으로
#   GCP에 로그인해 Secret Manager에서 받는다. infra가 main의 이 파일(.github/workflows/deploy.yml)
#   하나만 배포 계정을 쓰게 허용한다. 경로나 이름을 바꾸거나 다른 워크플로에서 uses:로 부르면
#   로그인이 거부된다.
# - 저장소 변수 GCP_PROJECT_ID, GCP_DEPLOY_WIF_PROVIDER, GCP_DEPLOYER_SA, CLOUDFLARE_ACCOUNT_ID,
#   API_HOST가 없으면 배포를 건너뛴다. 값은 infra README "CI 배포".
# - 다른 시크릿 저장소를 쓰는 배포는 "Read deploy secrets" 단계만 바꾼다. 뒤 단계는 환경 변수
#   CLOUDFLARE_API_TOKEN과 PUSH_SECRET만 본다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.GCP_DEPLOYER_SA != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write # WIF 토큰. 없으면 인증 단계가 실패한다
    env:
      API_HOST: ${{ vars.API_HOST }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler types
      - run: npm run check

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Read deploy secrets
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |
            cloudflare_api_token:${{ vars.GCP_PROJECT_ID }}/realtime-deploy-token
            push_secret:${{ vars.GCP_PROJECT_ID }}/realtime-push-secret

      # node_modules의 wrangler(package-lock 고정 버전)를 쓴다.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets.outputs.cloudflare_api_token }}
        run: |
          npx wrangler deploy \
            --routes "$API_HOST/realtime/*" \
            --var "JWKS_URL:https://$API_HOST/auth/.well-known/jwks.json" \
            --var "JWT_ISSUER:https://$API_HOST/auth/" \
            --var "JWT_AUDIENCE:https://$API_HOST"

      # 시크릿은 스크립트가 있어야 넣을 수 있다. 첫 배포는 이 단계가 끝날 때까지 push가 401이다.
      - name: Set PUSH_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets.outputs.cloudflare_api_token }}
          PUSH_SECRET: ${{ steps.secrets.outputs.push_secret }}
        run: printf '%s' "$PUSH_SECRET" | npx wrangler secret put PUSH_SECRET
